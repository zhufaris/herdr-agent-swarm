runtime:
  polling:
    transcriptIdentityMs: 50
    attachedTranscriptMs: 250
    workerTurnMs: 250
    externalTurnMs: 2000

  cache:
    herdrSnapshotTtlMs: 2000

  cards:
    updateDebounceMs: 250
    payloadLimitChars: 12000
    answerStreamLimitChars: 28000
    answerPageLimitChars: 21000
    # hidden | summary | visible. The default is visible and contains only
    # redacted, bounded reasoning text already visible in the Herdr pane.
    reasoningDisplay: visible

  paneClosure:
    confirmationTtlMs: 60000

  recovery:
    externalTurnNotFoundMaxAttempts: 3
